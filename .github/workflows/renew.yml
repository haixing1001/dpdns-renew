name: domain-renew

on:
  schedule:
    # 每天 UTC 03:17 运行(也可自行改成每周,如 '17 3 * * 1')
    - cron: '17 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 列出域名(仅确认连接,不修改)
        run: node scripts/list-domains.mjs
        env:
          # 一个 Key 一行;多账号直接把 Secret 存成多行文本(也兼容英文逗号分隔)
          DIGITALPLAT_API_KEY: ${{ secrets.DIGITALPLAT_API_KEY }}
          # DNSHE:一行一个账号,写成 "cfsd_xxx API-Secret"(未配置该平台时留空即可)
          DNSHE_API_KEY: ${{ secrets.DNSHE_API_KEY }}

      - name: 自动续期到期域名(内置规则:进入续期窗口后免费续一年)
        run: node scripts/renew.mjs
        env:
          # 多账号:同一份多行 Secret,脚本按账号逐个检查并按各自 Key 续期
          DIGITALPLAT_API_KEY: ${{ secrets.DIGITALPLAT_API_KEY }}
          DNSHE_API_KEY: ${{ secrets.DNSHE_API_KEY }}
          # 以下全部可选,不设置即用脚本内置默认(见 scripts/renew.mjs 顶部说明):
          # RENEW_THRESHOLD_DAYS: '120'
          # RENEW_YEARS: '1'
          # RENEW_PAYMENT_METHOD: ''
          # RENEW_PAYMENT_FREE: 'free'
          # RENEW_PAYMENT_PAID: 'credits'
          # RENEW_DELAY_MS: '300'
          # DRY_RUN: 'false'
